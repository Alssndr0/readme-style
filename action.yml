name: readme-style
description: Keep your README's words, upgrade its presentation. Check or apply readme-style in CI.
author: Alessandro
branding:
  icon: book-open
  color: purple

inputs:
  path:
    description: README files or folders, separated by spaces.
    default: .
  theme:
    description: Theme to apply. Defaults to the configuration, then to the theme recorded in the README.
    default: ""
  mode:
    description: '"check" fails when a README is not styled; "write" applies the changes (commit them in a later step).'
    default: check
  version:
    description: >-
      Release to download, such as v0.2.0. Defaults to this action's tag when it is pinned to a
      release; otherwise readme-style is built from the action's source.
    default: ""

runs:
  using: composite
  steps:
    - name: Install readme-style
      shell: bash
      env:
        RS_VERSION: ${{ inputs.version }}
        RS_ACTION_REF: ${{ github.action_ref }}
        RS_ACTION_PATH: ${{ github.action_path }}
        RS_REPOSITORY: ${{ github.action_repository }}
      run: bash "$RS_ACTION_PATH/action/install.sh"
    - name: Run readme-style
      shell: bash
      env:
        RS_PATHS: ${{ inputs.path }}
        RS_THEME: ${{ inputs.theme }}
        RS_MODE: ${{ inputs.mode }}
      run: |
        args=(--color always)
        if [ -n "$RS_THEME" ]; then args+=(--theme "$RS_THEME"); fi
        case "$RS_MODE" in
          check) args+=(--check) ;;
          write) args+=(--write) ;;
          *) echo "::error::mode must be check or write, got '$RS_MODE'"; exit 2 ;;
        esac
        read -ra paths <<< "$RS_PATHS"
        readme-style "${args[@]}" "${paths[@]}"
