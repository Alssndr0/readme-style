[package]
name = "readme-style"
description = "Keep your README's words, upgrade its presentation: badges, layout, navigation and callouts, deterministic and offline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

include = ["/src", "/tests", "/README.md", "/LICENSE"]

[[bin]]
name = "readme-style"
path = "src/main.rs"

[dependencies]
readme-style-core.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Alessandro"]
repository = "https://github.com/Alssndr0/readme-style"
homepage = "https://github.com/Alssndr0/readme-style"
keywords = ["readme", "markdown", "badges", "github", "formatter"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[workspace.dependencies]
readme-style-core = { path = "crates/readme-style-core", version = "0.2.0" }
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
comrak = { version = "0.59", default-features = false }
html5gum = "0.9"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
thiserror = "2.0"
toml = "1.1"
unicode-general-category = "1.1"
url = "2.5"
# dev
assert_cmd = "2.2"
insta = "1.49"
predicates = "3.1"
pretty_assertions = "1.4"
proptest = "1.12"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
assert_is_empty = "allow"
similar_names = "allow"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 1
